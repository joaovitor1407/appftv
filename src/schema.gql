type Cliente {
  id: ID!
  nome: String!
  email: String!
}

type Quadra {
  id: ID!
  nome: String!
  tipo: String!
}

type Agendamento {
  id: ID!
  startsAt: String!
  endsAt: String!
  customerId: ID!
  quadraId: ID!
  #Relacionamentos
  cliente: Cliente
  quadra: Quadra
}

### INPUTS ###

input createAgendamentoInput {
  startsAt: Date!
  endsAt: Date!
  customerId: ID!
  quadraId: ID!
}
## Queries (Rotas de Leitura)
type Query {
  getListaAgendamentos: [Agendamento!]!
  getClientes: [Cliente!]!
  getQuadras: [Quadra!]!
  getClienteById(id: ID): Cliente
  getAgendamentoById(id: ID): Agendamento
}

## Mutations (Rotas de Ação/Escrita)
type Mutation {
  createAgendamento(data: createAgendamentoInput!): Agendamento!
  deleteAgendamento(id: ID!): Boolean!
}
